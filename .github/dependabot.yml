version: 2
updates:
  # Maven dependencies (pom.xml) and the Maven wrapper (.mvn/wrapper)
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: daily
      time: '05:00'
      timezone: Asia/Jakarta
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - java
    commit-message:
      prefix: "build(deps)"
      prefix-development: "build(deps-dev)"
    groups:
      spring-boot:
        patterns:
          - "org.springframework.boot*"
      micrometer:
        patterns:
          - "io.micrometer*"
          - "io.zipkin*"
      maven-minor-patch:
        update-types:
          - minor
          - patch

  # GitHub Actions used in .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: '05:00'
      timezone: Asia/Jakarta
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - github_actions
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        patterns:
          - "*"

  # Base images in the Dockerfile (build + runtime JDK 25 images)
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "build(docker)"
    ignore:
      # Stay on the JDK 25 LTS line; skip major Java image bumps
      - dependency-name: "amazoncorretto"
        update-types: [ "version-update:semver-major" ]
      - dependency-name: "eclipse-temurin"
        update-types: [ "version-update:semver-major" ]

  # Observability stack images in compose.yaml (Prometheus, Jaeger, Loki, Grafana)
  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "build(compose)"
    groups:
      observability-stack:
        patterns:
          - "*"
